   <g id="text_1">
    <text style="fill: #2a6f97; font: 700 9.66px 'DejaVu Sans'; text-anchor: start" x="38.22912" y="40.163156" transform="rotate(-0 38.22912 40.163156)">1  Population estimand</text>
   </g>
   <g id="text_2">
    <!-- $\theta=I(C;B\mid\mathcal{F}^{0})$ -->
    <g style="fill: #202124" transform="translate(214.5462 64.6299)">
     <text>
      <tspan style="font: oblique 9.66px 'DejaVu Sans'" x="0 17.761276 24.376373 36.253372" y="-0.28281250000000036">θICB</tspan>
      <tspan style="font: 9.66px 'DejaVu Sans'" x="7.789124 20.609116 31.118774 44.759171 62.42144" y="-0.28281250000000036">=(;∣)</tspan>
      <tspan style="font: italic 9.66px 'STIXNonUnicode'" x="51.468567" y="-0.28281250000000036"></tspan>
      <tspan style="font: 6.762px 'DejaVu Sans'" x="57.856857" y="-3.9796875000000007">0</tspan>
     </text>
    </g>
   </g>
   <g id="text_3">
    <!-- $H(C\mid\mathcal{F}^{0})-H(C\mid\mathcal{F}^{B})=\theta$ -->
    <g style="fill: #202124" transform="translate(44.9856 89.3664)">
     <text>
      <tspan style="font: oblique 9.24px 'DejaVu Sans'" x="0 10.546478 50.621957 61.168435 101.565854" y="-0.6656250000000004">HCHCθ</tspan>
      <tspan style="font: 9.24px 'DejaVu Sans'" x="6.943817 18.793387 35.683743 41.085482 57.565774 69.415344 86.62764 92.02938" y="-0.6656250000000004">(∣)−(∣)=</tspan>
      <tspan style="font: italic 9.24px 'STIXNonUnicode'" x="25.209653 75.831609" y="-0.6656250000000004"></tspan>
      <tspan style="font: 6.468px 'DejaVu Sans'" x="31.318771" y="-4.198437500000001">0</tspan>
      <tspan style="font: oblique 6.468px 'DejaVu Sans'" x="81.940728" y="-4.198437500000001">B</tspan>
     </text>
    </g>
   </g>
   <g id="text_4">
    <text style="fill: #5f6368; font: 9.24px 'DejaVu Sans'; text-anchor: start" x="44.9856" y="106.037062" transform="rotate(-0 44.9856 106.037062)">Orders population DELB/Fano floors</text>
   </g>
   <g id="text_5">
    <text style="fill: #5f6368; font: 9.24px 'DejaVu Sans'; text-anchor: start" x="44.9856" y="123.345862" transform="rotate(-0 44.9856 123.345862)">Predictive information; not a causal effect</text>
   </g>
   <g id="text_6">
    <text style="fill: #d97706; font: 700 9.66px 'DejaVu Sans'; text-anchor: start" x="38.22912" y="178.633556" transform="rotate(-0 38.22912 178.633556)">2  Finite-sample estimator</text>
   </g>
   <g id="text_7">
    <!-- $\widehat{\theta}=\theta+b(N,K_{\mathrm{obs}},S_1,\nu)+\varepsilon$ -->
    <g style="fill: #202124" transform="translate(186.1458 203.602922)">
     <text>
      <tspan style="font: 6.037141px 'STIXSizeTwoSym'" x="7.414463" y="-5.3125">̂</tspan>
      <tspan style="font: oblique 9.66px 'DejaVu Sans'" x="0 17.761276 35.522552 45.419266 57.593307 81.088007 96.732759 117.747362" y="-0.10500000000000043">θθbNKSνε</tspan>
      <tspan style="font: 9.66px 'DejaVu Sans'" x="7.789124 25.5504 41.652008 52.642593 76.137292 91.782045 102.12668 107.775209" y="-0.10500000000000043">=+(,,,)+</tspan>
      <tspan style="font: 6.762px 'DejaVu Sans'" x="63.925507 68.061003 72.351622 87.217462" y="1.4793749999999992">obs1</tspan>
     </text>
    </g>
   </g>
   <g id="text_8">
    <text style="fill: #202124; font: 9.24px 'DejaVu Sans'; text-anchor: start" x="44.9856" y="227.198662" transform="rotate(-0 44.9856 227.198662)">Plugin or Miller--Madow statistic</text>
   </g>
   <g id="text_9">
    <text style="fill: #5f6368; font: 9.24px 'DejaVu Sans'; text-anchor: start" x="44.9856" y="244.507462" transform="rotate(-0 44.9856 244.507462)">Bias and variance depend on support</text>
   </g>
   <g id="text_10">
    <!-- $K_{\mathrm{obs}}/N,\ S_1,\ \nu/N$ diagnose sparsity -->
    <g style="fill: #5f6368" transform="translate(44.9856 261.8076)">
     <text>
      <tspan style="font: oblique 9.24px 'DejaVu Sans'" x="0 20.844801 35.485392 53.444874 61.714329" y="-0.984375">KNSνN</tspan>
      <tspan style="font: 6.468px 'DejaVu Sans'" x="6.055542 10.010356 14.113521 41.347056" y="0.5296874999999996">obs1</tspan>
      <tspan style="font: 9.24px 'DejaVu Sans'" x="17.733611 27.752547 45.712028 58.603138 68.622074 71.557407 77.419071 79.984669 85.643421 91.505085 97.357731 103.007465 107.818531 113.499836 116.435169 121.246235 127.107899 132.766651 136.563206 141.374271 143.939869 147.560566" y="-0.984375">/,,/ diagnose sparsity</tspan>
     </text>
    </g>
   </g>
   <g id="text_11">
    <text style="fill: #4d7c5b; font: 700 9.66px 'DejaVu Sans'; text-anchor: start" x="38.22912" y="317.103956" transform="rotate(-0 38.22912 317.103956)">3  Randomization reference</text>
   </g>
   <g id="text_12">
    <!-- $\mathcal{L}_{\pi}(\widehat{\theta}^{\pi}\mid H_0)$ -->
    <g style="fill: #202124" transform="translate(222.9504 342.1503)">
     <text>
      <tspan style="font: italic 9.66px 'STIXNonUnicode'" x="0" y="-0.10500000000000043"></tspan>
      <tspan style="font: oblique 6.762px 'DejaVu Sans'" x="6.784194 20.885276" y="1.4793749999999992 -3.801875000000001">ππ</tspan>
      <tspan style="font: 9.66px 'DejaVu Sans'" x="11.117744 27.100096 45.635123" y="-0.10500000000000043">(∣)</tspan>
      <tspan style="font: 6.037141px 'STIXSizeTwoSym'" x="22.299465" y="-5.3125">̂</tspan>
      <tspan style="font: oblique 9.66px 'DejaVu Sans'" x="14.885002 33.809493" y="-0.10500000000000043">θH</tspan>
      <tspan style="font: 6.762px 'DejaVu Sans'" x="41.07054" y="1.4793749999999992">0</tspan>
     </text>
    </g>
   </g>
   <g id="text_13">
    <!-- $\mu_{\mathrm{null}}=\mathbb{E}_{\pi}[\widehat{\theta}^{\pi}]$ need not be zero -->
    <g style="fill: #202124" transform="translate(44.9856 366.9078)">
     <text>
      <tspan style="font: oblique 9.24px 'DejaVu Sans'" x="0 42.984391" y="-0.5168749999999989">μθ</tspan>
      <tspan style="font: 6.468px 'DejaVu Sans'" x="5.875183 9.972035 14.068887 15.864806" y="0.9971875000000008">null</tspan>
      <tspan style="font: 9.24px 'DejaVu Sans'" x="19.712146 39.38173 52.866478 56.469139 59.404473 65.257119 70.938423 76.619728 82.481392 85.416725 91.269371 96.919106 100.539803 103.475136 109.3368 115.018105 117.953438 122.800576 128.48188 132.278435" y="-0.5168749999999989">=[] need not be zero</tspan>
      <tspan style="font: italic 9.24px 'STIXNonUnicode'" x="29.248621" y="-0.5168749999999989"></tspan>
      <tspan style="font: oblique 6.468px 'DejaVu Sans'" x="35.237698 48.722446" y="0.9971875000000008 -4.049687499999999">ππ</tspan>
      <tspan style="font: 5.77034px 'STIXSizeTwoSym'" x="50.021825" y="-5.515625">̂</tspan>
     </text>
    </g>
   </g>
   <g id="text_14">
    <!-- Compare $\widehat{\theta}_{\mathrm{obs}}$ with its null law -->
    <g style="fill: #5f6368" transform="translate(44.9856 384.2166)">
     <text>
      <tspan style="font: 9.24px 'DejaVu Sans'" x="0 6.44783 12.097565 21.092957 26.95462 32.613373 36.409927 42.091232 62.442689 65.378022 72.930543 75.49614 79.116837 84.969483 87.904817 90.470414 94.091111 98.902177 101.83751 107.690156 113.542802 116.108399 118.673997 121.60933 124.174928 129.83368" y="-0.5168749999999989">Compare  with its null law</tspan>
      <tspan style="font: 5.77034px 'STIXSizeTwoSym'" x="52.063999" y="-5.515625">̂</tspan>
      <tspan style="font: oblique 9.24px 'DejaVu Sans'" x="45.026566" y="-0.5168749999999989">θ</tspan>
      <tspan style="font: 6.468px 'DejaVu Sans'" x="50.76462 54.719435 58.822599" y="0.9971875000000008">obs</tspan>
     </text>
    </g>
   </g>
   <g id="text_15">
    <!-- Recompute statistic and support after $\pi$ -->
    <g style="fill: #5f6368" transform="translate(44.9856 400.278)">
     <text>
      <tspan style="font: 9.24px 'DejaVu Sans'" x="0 6.41626 12.097565 17.174667 22.824402 31.819794 37.681458 43.534103 47.1548 52.836105 55.771439 60.582504 64.203201 69.861954 73.482651 76.048248 80.859314 84.480011 87.045609 92.122711 95.058044 100.716797 106.569443 112.431107 115.36644 120.177505 126.030151 131.891815 137.753479 143.403214 147.199768 150.820465 153.755798 159.414551 162.665512 166.286209 171.967514 175.764069" y="-0.984375">Recompute statistic and support after </tspan>
      <tspan style="font: oblique 9.24px 'DejaVu Sans'" x="178.699402" y="-0.984375">π</tspan>
     </text>
    </g>
   </g>
   <g id="text_16">
    <text style="fill: #5f6368; font: 8.7px 'DejaVu Sans'; text-anchor: start" x="267.264" y="150.241856" transform="rotate(-0 267.264 150.241856)">sample + discretize</text>
   </g>
   <g id="text_17">
    <!-- apply $\pi$; recompute -->
    <g style="fill: #5f6368" transform="translate(267.264 288.7041)">
     <text>
      <tspan style="font: 8.7px 'DejaVu Sans'" x="0 5.323639 10.838165 16.352692 18.766357 23.907593 31.899414 34.826355 37.58786 41.159576 46.504425 51.280853 56.596008 65.058685 70.573212 76.079254 79.485535" y="-0.40625">apply ; recompute</tspan>
      <tspan style="font: oblique 8.7px 'DejaVu Sans'" x="26.669098" y="-0.40625">π</tspan>
     </text>
    </g>
   </g>
