[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "entropy-crime-bike"
version = "0.1.0"
description = "Reproducible empirical pipeline for discrete crime predictability bounds"
requires-python = ">=3.12"
dependencies = [
  "numpy>=1.26,<2",
  "pandas>=2.2,<3",
  "pyarrow>=16,<17",
  "pyproj>=3.6,<4",
  "PyYAML>=6,<7",
  "matplotlib>=3.8,<4",
  "scipy>=1.13,<2",
  "scikit-learn>=1.5,<2",
  "joblib>=1.4,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
