experiment_id: E03
experiment_name: numerical_validation_of_discrete_entropy_lower_bound
source_e02_data_pointer: processed_data/e02/latest_e02_data.txt
random_seed: 20260718
numerics:
  lattice_tail_tolerance: 1.0e-15
  root_tolerance: 1.0e-12
  entropy_grid_min_bits: 0.0
  entropy_grid_max_bits: 8.0
  entropy_grid_points: 321
  lambda_grid_min: 1.0e-4
  lambda_grid_max: 20.0
  lambda_grid_points: 121
validation:
  inverse_relative_tolerance: 1.0e-8
  entropy_absolute_tolerance_bits: 1.0e-9
  conservative_slack_tolerance: 1.0e-10
  simulation_final_relative_moment_tolerance: 0.03
  simulation_final_entropy_tolerance_bits: 0.03
simulation:
  target_entropies_bits: [0.5, 1.0, 2.0, 3.0]
  sample_sizes: [1000, 10000, 100000]
  repetitions: 20
range_calibration:
  outcomes:
    - crime_count_all
    - crime_count_property_theft
    - crime_count_vehicle_theft
    - crime_count_burglary
  splits: [full, train, validation, test]
reporting:
  figure_dpi: 300
  make_qc_workbook: true
