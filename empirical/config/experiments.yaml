  temporal_resolution: day
  crime_lags: [1]
  bicycle_lags: [1]
  crime_lag_bins: [0, 1, 2, "3+"]
  bicycle_bins: [zero, positive_tertile_1, positive_tertile_2, positive_tertile_3]
  entropy_estimator: miller_madow
  bootstrap_block_days: 7
  bootstrap_repetitions_development: 500
  bootstrap_repetitions_final: 1000
robustness:
  spatial_resolution_m: [500, 2000]
