  crime_lags: [2, 3, 7]
  bicycle_lags: [2, 3, 7, 14, 30]
  entropy_estimators: [plugin, bayesian_dirichlet]
  bootstrap_block_days: [14, 28]
validation:
  train_start: 2020-01-01
  train_end: 2021-12-31
  validation_start: 2022-01-01
