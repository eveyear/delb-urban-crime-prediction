experiment_id: E09
experiment_name: prespecified_robustness_analysis
source_e01_data_pointer: processed_data/e01/latest_e01_data.txt
source_e02_data_pointer: processed_data/e02/latest_e02_data.txt
source_e04_run_pointer: runs/latest_e04_run.txt
source_e06_run_pointer: runs/latest_e06_run.txt
random_seed: 20260718
target: crime_count_all
domain: bike_covered_training

frozen_matrix:
  primary:
    spatial_resolution_m: 1000
    temporal_resolution: day
    crime_lag_days: 1
    bicycle_lag_days: 1
    crime_bins: four_state
    bicycle_bins: zero_plus_positive_tertiles
    bicycle_measure: bike_total_flow
    entropy_estimator: miller_madow
    bootstrap_block_days: 7
  spatial_resolution_m: [500, 2000]
  temporal_resolution: [week]
  crime_lag_days: [2, 3, 7]
  bicycle_lag_days: [2, 3, 7]
  crime_bins: [zero_one_two_plus]
  bicycle_bins:
    - zero_plus_positive_median
    - zero_plus_positive_quintiles
  bicycle_measures:
    - bike_outflow
    - bike_inflow
    - bike_absolute_net_flow
  entropy_estimators:
    - plugin
    - miller_madow
    - jeffreys_dirichlet
  bootstrap_block_days: [7, 14, 28]
  rolling_origins:
    start: 2022-01-01
    end: 2022-12-31
    frequency: month
    minimum_training_end: 2021-12-31
    hyperparameters: reuse_accepted_e06_validation_selection
    model_families:
      - state_mean
      - poisson_glm
      - negative_binomial_glm
      - histogram_gradient_boosting_poisson

information_sets:
  baseline_state:
    - grid_id
    - crime_lag_bin
    - day_of_week
    - season
    - is_holiday
  bicycle_state_field: bicycle_lag_bin
  bicycle_positive_quantiles_primary:
    - 0.3333333333333333
    - 0.6666666666666666

estimation:
  jeffreys_alpha: 0.5
  jeffreys_support: observed_full_joint_atoms_with_coherent_dirichlet_aggregation
  nonnegative_cmi_for_bound_only: true
  block_bootstrap_repetitions: 1000
  confidence_level: 0.95

spatial:
  diagnostic_resolution_m: 250
  diagnostic_minimum_mean_training_events_per_active_grid: 20
  diagnostic_promote: false
  anchor: global_projected_crs_origin

numerics:
  lattice_tail_tolerance: 1.0e-15
  root_tolerance: 1.0e-12

acceptance:
  expected_cities: 3
  required_theory_specifications:
    - primary
    - spatial_500m
    - spatial_2000m
    - weekly
    - crime_bins_coarse
    - bicycle_bins_median
    - bicycle_bins_quintiles
    - crime_lag2
    - crime_lag3
    - crime_lag7
    - bicycle_lag2
    - bicycle_lag3
    - bicycle_lag7
    - bicycle_outflow
    - bicycle_inflow
    - bicycle_absolute_net
  expected_rolling_origins_per_city: 12
  expected_rolling_model_contrasts: 144
  entropy_identity_tolerance_bits: 1.0e-10
  bound_order_tolerance: 1.0e-10

reporting:
  figure_dpi: 300
  make_qc_workbook: true
  figures_are_python_generated: true
