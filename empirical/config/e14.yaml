experiment_id: E14
experiment_name: fano_classification_validation
source_e02_data_pointer: processed_data/e02/latest_e02_data.txt
source_e04_run_pointer: runs/latest_e04_run.txt
random_seed: 20260720

domain: bike_covered_training
splits:
  pretest: [train, validation]
  test: test

information_sets:
  baseline:
    - grid_id
    - crime_lag_bin
    - day_of_week
    - season
    - is_holiday
  bicycle_aware:
    - grid_id
    - crime_lag_bin
    - day_of_week
    - season
    - is_holiday
    - bicycle_lag_bin
  crime_lag_field: crime_count_lag1
  bicycle_lag_field: bike_total_flow_lag1
  bicycle_threshold_source: accepted_e04_training_only

targets:
  binary_occurrence:
    classes: 2
    definition: zero_vs_positive
  three_level_count:
    classes: 3
    definition: zero_one_two_plus

estimation:
  estimators: [plugin, miller_madow]
  primary_estimator: miller_madow
  entropy_clip_tolerance_bits: 1.0e-12
  unseen_state_fallback: global_pretest_mode

bootstrap:
  repetitions: 300
  block_days: 7
  confidence_level: 0.95
  resampling_unit: nonoverlapping_calendar_blocks
  preserve_cross_grid_daily_dependence: true
  terminal_remainder_fixed: true

oracle:
  baseline_state_counts: [4, 16]
  bicycle_state_counts: [2, 4]
  balance_regimes: [balanced, skewed]
  effect_strengths: [0.0, 0.5]
  negative_binomial:
    dispersion: 2.5
    minimum_mean: 0.35
    maximum_mean: 2.0
    tail_probability_tolerance: 1.0e-12
    markov_persistence: 0.85

acceptance:
  expected_cities: 3
  expected_point_rows: 24
  expected_bootstrap_rows: 7200
  expected_oracle_rows: 64
  expected_pair_rows: 12
  expected_test_observations: 75992
  oracle_tolerance: 1.0e-12
  entropy_tolerance_bits: 1.0e-10

reporting:
  figure_dpi: 300
  parquet_compression: zstd
  figures_are_python_generated: true
