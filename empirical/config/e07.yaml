experiment_id: E07
experiment_name: theory_practice_predictability_gap
source_e02_data_pointer: processed_data/e02/latest_e02_data.txt
source_e04_run_pointer: runs/latest_e04_run.txt
source_e05_run_pointer: runs/latest_e05_run.txt
source_e06_run_pointer: runs/latest_e06_run.txt
random_seed: 20260718
target: crime_count_all
domain: bike_covered_training
information_sets:
  crime_lag_field: crime_count_lag1
  bicycle_lag_field: bike_total_flow_lag1
  baseline_state:
    - grid_id
    - crime_lag_bin
    - day_of_week
    - season
    - is_holiday
  local_baseline_state:
    - crime_lag_bin
    - day_of_week
    - season
    - is_holiday
  bicycle_state_field: bicycle_lag_bin
estimands:
  primary_error: mse_integer
  predictability_gap: empirical_mse_minus_matched_delb
  information_use_efficiency: matched_delb_divided_by_empirical_mse
  gap_narrowing: delta_mse_minus_delta_delb
  realization_ratio_diagnostic: delta_mse_divided_by_delta_delb
  city_period: test
  local_theory_periods:
    - train
    - validation
  local_empirical_period: test
  local_eligibility_source: accepted_e05
uncertainty:
  block_days: 7
  city_repetitions: 1000
  local_correlation_repetitions: 2000
  confidence_level: 0.95
  city_resampling_unit: shared_nonoverlapping_test_calendar_block
  local_resampling_unit: paired_spatial_grid
inference:
  local_association: spearman
  multiple_testing: benjamini_hochberg
  pooled_regression: delta_mse_on_delta_delb_with_city_fixed_effects
  regression_covariance: HC3
classification:
  theory_threshold: city_median_delta_delb
  empirical_threshold: city_model_median_delta_mse
  tie_rule: ties_are_low
numerics:
  lattice_tail_tolerance: 1.0e-15
  root_tolerance: 1.0e-12
  bootstrap_bound_interpolation_max_entropy_bits: 8.0
  identity_tolerance: 1.0e-10
acceptance:
  expected_cities: 3
  expected_models: 4
  expected_test_observations: 75992
  expected_city_bound_rows: 3
  expected_city_model_rows: 12
  expected_city_bootstrap_rows: 12000
  expected_e05_eligible_grids: 339
  expected_local_join_rows: 1356
  expected_local_association_rows: 12
  expected_regression_rows: 4
reporting:
  figure_dpi: 300
  primary_display_model: histogram_gradient_boosting_poisson
  make_qc_workbook: true
