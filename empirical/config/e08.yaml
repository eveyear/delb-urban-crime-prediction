experiment_id: E08
experiment_name: crime_type_heterogeneity
source_e02_data_pointer: processed_data/e02/latest_e02_data.txt
source_e04_run_pointer: runs/latest_e04_run.txt
random_seed: 20260718
domain: bike_covered_training
outcomes:
  PROPERTY_THEFT:
    target: crime_count_property_theft
    label: Property theft
  VEHICLE_THEFT:
    target: crime_count_vehicle_theft
    label: Vehicle theft
  BURGLARY:
    target: crime_count_burglary
    label: Burglary
splits:
  training: train
  validation: validation
  test: test
information_sets:
  crime_lag_field: category_crime_count_lag1
  bicycle_lag_field: bike_total_flow_lag1
  baseline:
    - grid_id
    - crime_lag_bin
    - day_of_week
    - season
    - is_holiday
  bicycle_aware:
    - grid_id
    - crime_lag_bin
    - day_of_week
    - season
    - is_holiday
    - bicycle_lag_bin
  baseline_state:
    - grid_id
    - crime_lag_bin
    - day_of_week
    - season
    - is_holiday
  bicycle_state_field: bicycle_lag_bin
prediction:
  integer_rounding: nonnegative_half_up
  continuous_prediction_floor: 1.0e-9
  primary_metric: mse_integer
models:
  matched_families:
    - state_mean
    - poisson_glm
    - negative_binomial_glm
    - histogram_gradient_boosting_poisson
  state_mean:
    smoothing_candidates: [0.0, 5.0, 20.0, 100.0]
  poisson_glm:
    alpha_candidates: [0.0001, 0.001, 0.01, 0.1, 1.0]
    max_iter: 500
    tolerance: 1.0e-8
  negative_binomial_glm:
    dispersion_candidates: [0.1, 0.5, 1.0, 2.0]
    l2_penalty: 1.0e-5
    max_iter: 250
    tolerance: 1.0e-8
  histogram_gradient_boosting_poisson:
    max_iter: 250
    min_samples_leaf: 50
    candidates:
      - learning_rate: 0.05
        max_leaf_nodes: 15
        l2_regularization: 1.0
      - learning_rate: 0.05
        max_leaf_nodes: 31
        l2_regularization: 10.0
      - learning_rate: 0.1
        max_leaf_nodes: 15
        l2_regularization: 10.0
      - learning_rate: 0.1
        max_leaf_nodes: 31
        l2_regularization: 10.0
  external_benchmark:
    family: seasonal_naive_lag7
    matched_to_delb: false
uncertainty:
  block_days: 7
  repetitions: 1000
  confidence_level: 0.95
  resampling_unit: shared_city_nonoverlapping_calendar_block
  paired_category_contrasts: true
inference:
  positive_information_test: one_sided_normal_from_block_bootstrap
  positive_prediction_test: one_sided_normal_from_joint_block_bootstrap
  category_heterogeneity_test: two_sided_paired_block_normal
  multiple_testing: benjamini_hochberg
  false_discovery_rate_alpha: 0.05
numerics:
  lattice_tail_tolerance: 1.0e-15
  root_tolerance: 1.0e-12
  bootstrap_bound_interpolation_max_entropy_bits: 8.0
  identity_tolerance: 1.0e-10
acceptance:
  expected_cities: 3
  expected_outcomes: 3
  expected_models: 4
  expected_theory_rows: 18
  expected_theory_bootstrap_rows: 18000
  expected_theory_pairwise_rows: 9
  expected_metric_rows: 81
  expected_matched_contrasts: 36
  expected_prediction_bootstrap_rows: 36000
  expected_prediction_pairwise_rows: 36
  expected_test_observations_per_outcome: 75992
  expected_prediction_rows: 2051784
  expected_serialized_models: 72
reporting:
  figure_dpi: 300
  primary_display_model: histogram_gradient_boosting_poisson
  make_qc_workbook: true
