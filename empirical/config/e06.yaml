experiment_id: E06
experiment_name: matched_out_of_sample_predictive_models
source_e02_data_pointer: processed_data/e02/latest_e02_data.txt
source_e04_run_pointer: runs/latest_e04_run.txt
random_seed: 20260718
target: crime_count_all
domain: bike_covered_training
splits:
  training: train
  validation: validation
  test: test
information_sets:
  baseline:
    - grid_id
    - crime_lag_bin
    - day_of_week
    - season
    - is_holiday
  bicycle_aware:
    - grid_id
    - crime_lag_bin
    - day_of_week
    - season
    - is_holiday
    - bicycle_lag_bin
  crime_lag_field: crime_count_lag1
  bicycle_lag_field: bike_total_flow_lag1
  bicycle_threshold_source: accepted_e04_training_only
prediction:
  integer_rounding: nonnegative_half_up
  continuous_prediction_floor: 1.0e-9
  primary_metric: mse_integer
  auxiliary_metrics:
    - mse_continuous
    - rmse_integer
    - mae_integer
    - mean_poisson_deviance_continuous
models:
  matched_families:
    - state_mean
    - poisson_glm
    - negative_binomial_glm
    - histogram_gradient_boosting_poisson
  state_mean:
    smoothing_candidates: [0.0, 5.0, 20.0, 100.0]
  poisson_glm:
    alpha_candidates: [0.0001, 0.001, 0.01, 0.1, 1.0]
    max_iter: 500
    tolerance: 1.0e-8
  negative_binomial_glm:
    dispersion_candidates: [0.1, 0.5, 1.0, 2.0]
    l2_penalty: 1.0e-5
    max_iter: 250
    tolerance: 1.0e-8
  histogram_gradient_boosting_poisson:
    max_iter: 250
    min_samples_leaf: 50
    candidates:
      - learning_rate: 0.05
        max_leaf_nodes: 15
        l2_regularization: 1.0
      - learning_rate: 0.05
        max_leaf_nodes: 31
        l2_regularization: 10.0
      - learning_rate: 0.1
        max_leaf_nodes: 15
        l2_regularization: 10.0
      - learning_rate: 0.1
        max_leaf_nodes: 31
        l2_regularization: 10.0
  external_benchmark:
    family: seasonal_naive_lag7
    matched_to_delb: false
uncertainty:
  block_days: 7
  repetitions: 1000
  confidence_level: 0.95
  resampling_unit: nonoverlapping_test_calendar_blocks
  preserve_cross_grid_daily_dependence: true
acceptance:
  expected_cities: 3
  expected_matched_families: 4
  expected_information_sets: 2
  expected_test_observations: 75992
  expected_metric_rows: 27
  expected_pair_contrasts: 12
  expected_bootstrap_rows: 12000
  threshold_tolerance: 1.0e-12
  metric_recalculation_tolerance: 1.0e-12
reporting:
  figure_dpi: 300
  primary_display_model: histogram_gradient_boosting_poisson
  make_qc_workbook: true
